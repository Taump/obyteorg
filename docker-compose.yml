# Local development in a container (production: deploy/docker-compose.yml):
#   docker compose up        → http://localhost:3000
services:
  dev:
    image: node:22.23.5-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    # corepack installs the pnpm version pinned in package.json (packageManager)
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"

volumes:
  node_modules:
